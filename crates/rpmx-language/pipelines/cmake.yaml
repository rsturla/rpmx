name: cmake
version: 1
summary: Configure, build, check and install a CMake project
inputs:
  args:
    type: list<string>
    default: []
needs:
  packages: [cmake]
run:
  cwd: "${source.dir}"
  runs: |
    cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR="${LIBDIR##*/}" ${inputs.args}
    cmake --build build --parallel "$JOBS"
    ctest --test-dir build --output-on-failure
    DESTDIR="$STAGE" cmake --install build --prefix "$PREFIX"
