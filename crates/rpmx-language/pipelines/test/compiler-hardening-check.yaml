name: test/compiler-hardening-check
version: 1
summary: Check that a compiler wrapper produces hardened executables
inputs:
  cc:
    type: string
    required: true
needs:
  packages: [bash, binutils, coreutils, findutils, grep, sed]
run:
  runs: |
    set -eu
    work=$(mktemp -d)
    trap 'rm -rf "$work"' EXIT
    cd "$work"

    cat > hello.c <<'EOF'
    #include <stdio.h>
    #include <string.h>

    int main(int argc, char **argv) {
        char buffer[4096];
        strcpy(buffer, argc > 1 ? argv[1] : "hardening");
        puts(buffer);
        return 0;
    }
    EOF

    cc="${inputs.cc}"
    : "${CFLAGS:=}"
    : "${LDFLAGS:=}"
    failures=0
    fail() {
      echo "compiler-hardening-check: $1" >&2
      failures=$((failures + 1))
    }

    check_common() {
      # Consume readelf output completely so strict pipelines do not see SIGPIPE.
      file=$1
      type=$(readelf -h "$file" | sed -n 's/^[[:space:]]*Type:[[:space:]]*//p')
      case "$type" in
        *DYN*) ;;
        *) fail "$file is not position-independent ($type)" ;;
      esac
      if ! readelf -lW "$file" | grep 'GNU_STACK' >/dev/null; then
        fail "$file has no GNU_STACK program header"
      elif readelf -lW "$file" | grep 'GNU_STACK.*RWE' >/dev/null; then
        fail "$file has an executable stack"
      fi
      if ! readelf -lW "$file" | grep 'GNU_RELRO' >/dev/null; then
        fail "$file has no GNU_RELRO segment"
      fi
      if ! readelf -dW "$file" | grep -E 'BIND_NOW|FLAGS(_1)?[^:]*NOW' >/dev/null; then
        fail "$file is not linked with BIND_NOW"
      fi
      if ! readelf -nW "$file" | grep 'Build ID:' >/dev/null; then
        fail "$file has no build ID note"
      fi
    }

    check_branch_protection() {
      file=$1
      case "$RPMX_TARGET_ARCH" in
        x86_64)
          if ! readelf -nW "$file" | grep 'IBT' >/dev/null; then
            fail "$file has no x86 IBT property"
          fi
          if ! readelf -nW "$file" | grep 'SHSTK' >/dev/null; then
            fail "$file has no x86 SHSTK property"
          fi
          ;;
        aarch64)
          if ! readelf -nW "$file" | grep 'BTI' >/dev/null; then
            fail "$file has no aarch64 BTI property"
          fi
          if ! readelf -nW "$file" | grep -E '(^|[[:space:],])PAC([[:space:],]|$)' >/dev/null; then
            fail "$file has no aarch64 PAC property"
          fi
          ;;
      esac
    }

    # The wrapper must harden a normal executable. The stack buffer and the
    # strcpy call make both the stack protector and fortify observable.
    $cc $CFLAGS -O2 -o hello hello.c $LDFLAGS
    check_common hello
    hello_output=$(./hello)
    if [ "$hello_output" != hardening ]; then
      fail "hello returned unexpected output"
    fi
    if ! readelf -sW hello | grep '__stack_chk_fail' >/dev/null; then
      fail "hello has no stack-protector reference"
    fi
    if ! readelf -sW hello | grep -E '__[[:alnum:]_]+_chk(@|$)' >/dev/null; then
      fail "hello has no fortified libc reference"
    fi

    # A shared library must still link. This catches an unconditional -pie in
    # LDFLAGS, which turns a -shared link into an executable link.
    cat > branch.c <<'EOF'
    __attribute__((noinline)) int compiler_hardening_callee(int value) {
        return value + 1;
    }
    int compiler_hardening_entry(int value) {
        volatile int result = compiler_hardening_callee(value);
        return result + 1;
    }
    EOF
    $cc $CFLAGS -fPIC -shared -o libprobe.so branch.c $LDFLAGS
    check_common libprobe.so

    # Branch-protection notes merge all relocatable inputs, including CRT
    # objects supplied by compiler/libc dependencies. Test this wrapper's code
    # in both final link modes without those startup objects. GCC/package tests
    # must check their own CRT protection separately. The non-leaf call prevents
    # return-signing coverage from being optimized into a leaf or tail call.
    $cc $CFLAGS -O2 -nostartfiles -Wl,-e,compiler_hardening_entry -o branch-probe branch.c $LDFLAGS
    $cc $CFLAGS -O2 -fPIC -shared -nostartfiles -o libbranch-probe.so branch.c $LDFLAGS
    for file in branch-probe libbranch-probe.so; do
      check_common "$file"
      check_branch_protection "$file"
    done
    # The custom ELF entry is for inspection only, not a process-startup ABI.
    # Execute the ordinary hello above to verify its real libc/startup closure.

    if [ "$failures" -ne 0 ]; then
      echo "compiler-hardening-check: $failures failure(s) for $cc" >&2
      exit 1
    fi
    echo "compiler-hardening-check: $cc produced hardened executables and shared libraries"
