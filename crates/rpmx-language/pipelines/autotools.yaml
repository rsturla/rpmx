name: autotools
version: 1
summary: Configure, build, check and install an autotools project
inputs:
  args:
    type: list<string>
    default: []
needs:
  tools: [make]
run:
  cwd: /tmp/build
  runs: |
    ./configure --prefix=/usr --libdir=/usr/lib64 ${inputs.args}
    make -j"$JOBS"
    make check
    make install DESTDIR="$STAGE"
