name: autotools
version: 1
summary: Configure, build, check and install an autotools project
inputs:
  args:
    type: list<string>
    default: []
needs:
  tools: [make]
run:
  cwd: "${source.dir}"
  runs: |
    ./configure --prefix="$PREFIX" --libdir="$LIBDIR" ${inputs.args}
    make -j"$JOBS"
    make check
    make install DESTDIR="$STAGE"
