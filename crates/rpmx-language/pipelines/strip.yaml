name: strip
version: 1
summary: Strip ELF files and optionally extract debuginfo
needs:
  tools: [binutils, findutils]
run:
  runs: |
    find "$STAGE" -type f -exec sh -c '
      debug_root="$STAGE$PREFIX/lib/debug"
      for f do
        case "$f" in
          "$debug_root/"*) continue ;;
        esac
        if [ "$RPMX_DEBUGINFO" = "1" ]; then
          rel="$${f#"$STAGE"}"
          debug="$debug_root$rel.debug"
          mkdir -p "$(dirname "$debug")"
          if objcopy --only-keep-debug "$f" "$debug" 2>/dev/null; then
            strip --strip-unneeded "$f" 2>/dev/null || true
            ( cd "$(dirname "$debug")" && objcopy --add-gnu-debuglink="$(basename "$debug")" "$f" ) 2>/dev/null || true
          else
            rm -f "$debug"
          fi
        else
          strip --strip-unneeded "$f" 2>/dev/null || true
        fi
      done
    ' sh {} +
