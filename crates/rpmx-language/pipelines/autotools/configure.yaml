name: autotools/configure
version: 2
summary: Configure an autotools project
inputs:
  args:
    type: list<string>
    default: []
needs:
  tools: [make]
run:
  cwd: "${source.dir}"
  runs: |
    cross=""
    if [ "$RPMX_CROSS" = 1 ]; then
      cross="--host=$RPMX_TARGET_TRIPLE"
    fi
    ./configure --prefix="$PREFIX" --libdir="$LIBDIR" $cross ${inputs.args}
