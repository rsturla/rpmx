name: python/build-wheel
version: 1
summary: Build a PEP 517 wheel
inputs:
  python:
    type: string
    default: python3
  build-package:
    type: string
    default: python-build
needs:
  packages: ["${inputs.build-package}"]
run:
  cwd: "${source.dir}"
  argv: ["${inputs.python}", -m, build, --wheel, --no-isolation, --outdir, dist]
