name: make
version: 1
summary: Build, check and install a Makefile project
inputs:
  args:
    type: list<string>
    default: []
  install_args:
    type: list<string>
    default: []
needs:
  tools: [make]
run:
  cwd: "${source.dir}"
  runs: |
    make -j"$JOBS" ${inputs.args}
    make check
    make install DESTDIR="$STAGE" ${inputs.install_args}
