name: meson
version: 1
summary: Configure, build, test and install a Meson project
inputs:
  args:
    type: list<string>
    default: []
needs:
  packages: [meson]
run:
  cwd: "${source.dir}"
  runs: |
    meson setup build --prefix="$PREFIX" --libdir="${LIBDIR##*/}" --buildtype=release ${inputs.args}
    meson compile -C build -j "$JOBS"
    meson test -C build --print-errorlogs
    meson install -C build --destdir "$STAGE"
