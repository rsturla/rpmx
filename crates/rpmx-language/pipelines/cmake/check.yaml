name: cmake/check
version: 2
summary: Run CTest tests
inputs:
  dir:
    type: string
    default: build
  args:
    type: list<string>
    default: []
needs:
  packages: [cmake]
run:
  cwd: "${source.dir}"
  runs: |
    ctest --test-dir "${inputs.dir}" --output-on-failure --no-tests=error ${inputs.args}
