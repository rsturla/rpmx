name: cmake/configure
version: 2
summary: Configure a CMake project
inputs:
  args:
    type: list<string>
    default: []
needs:
  packages: [cmake]
run:
  cwd: "${source.dir}"
  runs: |
    cross=""
    if [ "$RPMX_CROSS" = 1 ]; then
      cross="-DCMAKE_TOOLCHAIN_FILE=$RPMX_CMAKE_TOOLCHAIN_FILE"
    fi
    cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_INSTALL_LIBDIR="${LIBDIR##*/}" $cross ${inputs.args}
