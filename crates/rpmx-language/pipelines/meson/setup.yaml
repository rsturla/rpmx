name: meson/setup
version: 2
summary: Configure a Meson project
inputs:
  args:
    type: list<string>
    default: []
needs:
  packages: [meson, ninja]
run:
  cwd: "${source.dir}"
  runs: |
    cross=""
    if [ "$RPMX_CROSS" = 1 ]; then
      cross="--cross-file=$RPMX_MESON_CROSS_FILE"
    fi
    meson setup build --prefix="$PREFIX" --libdir="${LIBDIR##*/}" --buildtype=release $cross ${inputs.args}
