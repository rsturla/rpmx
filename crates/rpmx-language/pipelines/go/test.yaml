name: go/test
version: 2
summary: Run Go tests
inputs:
  packages:
    type: string
    default: "./..."
  args:
    type: list<string>
    default: []
  cgo:
    type: boolean
    default: true
needs:
  tools: [go]
run:
  cwd: "${source.dir}"
  runs: |
    cgo=0
    if [ "${inputs.cgo}" = true ]; then cgo=1; fi
    CGO_ENABLED=$cgo go test ${inputs.args} ${inputs.packages}
