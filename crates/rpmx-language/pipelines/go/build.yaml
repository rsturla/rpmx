name: go/build
version: 2
summary: Build a Go binary
inputs:
  output:
    type: string
    required: true
  packages:
    type: string
    default: "."
  args:
    type: list<string>
    default: []
  # A distribution package links the system C library on purpose: the pure-Go
  # resolver ignores nsswitch.conf and os/user ignores NSS. Opt out only for a
  # package that must be static.
  cgo:
    type: boolean
    default: true
needs:
  packages: [go]
run:
  cwd: "${source.dir}"
  runs: |
    cgo=0
    if [ "${inputs.cgo}" = true ]; then cgo=1; fi
    CGO_ENABLED=$cgo go build ${inputs.args} -o "$STAGE${inputs.output}" ${inputs.packages}
