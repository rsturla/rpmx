name: python
version: 1
summary: Build and install a PEP 517 wheel
inputs:
  python:
    type: string
    default: python3
  build-package:
    type: string
    default: python-build
  pip-package:
    type: string
    default: python-pip
  prefix:
    type: string
    default: "${prefix}"
needs:
  packages: ["${inputs.build-package}", "${inputs.pip-package}"]
run:
  cwd: "${source.dir}"
  runs: |
    ${inputs.python} -m build --wheel --no-isolation --outdir dist
    ${inputs.python} -m pip install --root "$STAGE" --prefix ${inputs.prefix} --no-index --no-deps dist/*.whl
