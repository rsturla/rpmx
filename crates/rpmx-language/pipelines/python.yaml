name: python
version: 1
summary: Build and install a PEP 517 wheel
inputs:
  python:
    type: string
    default: python3
  prefix:
    type: string
    default: "${prefix}"
needs:
  tools: [python3-build, python3-setuptools, python3-wheel, python3-pip]
run:
  cwd: "${source.dir}"
  runs: |
    ${inputs.python} -m build --wheel --no-isolation --outdir dist
    ${inputs.python} -m pip install --root "$STAGE" --prefix ${inputs.prefix} --no-index --no-deps dist/*.whl
