# yaml-language-server: $schema=https://example.org/rpmx/distro.schema.json
#
# DESIGN SKETCH - proposed distro document.
#
# Acme only writes what it cares about. Root, repositories, package list and
# most policy come from fedora-44.

document: rpmx-distro
version: 1
name: acme
extends: fedora-44
dist-tag: .acme1

flags:
  cflags: [-O2, -g, -pipe]
  ldflags: [-Wl,-z,relro, -Wl,-z,now]

features:
  enable: [color]
  disable: [verbose]

policy:
  require-tests: true
  sbom: true
