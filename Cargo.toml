[workspace]
resolver = "2"
members = ["crates/rpmx-base", "crates/rpmx-payload", "crates/rpmx-language", "crates/rpmx-store", "crates/rpmx-runner", "crates/rpmx-root", "crates/rpmx-build", "crates/rpmx-core", "crates/rpmx-rpm", "crates/rpmx-cli"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0 OR MIT"
authors = ["rpmx contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
ureq = "3"
tar = "0.4"
saphyr-parser = "0.3"
sha2 = "0.10"
globset = "0.4"
goblin = "0.9"
clap = { version = "4", features = ["derive"] }
rpm = "0.30"
pgp = "0.20"
rand = "0.8"

[patch.crates-io]
rpm = { path = "vendor/rpm" }
